name: Release

# 编译 Linux / macOS / Windows 三端安装包，并发布到 GitHub Releases。
# 用法：
#   - 推送 tag（如 v1.2.3）自动触发：git tag v1.2.3 && git push origin v1.2.3
#   - 或在 Actions 页面手动 Run workflow 做 CI 验证（会发布到草稿 Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'        # Linux (.deb / .AppImage / .rpm)
            args: ''
          - platform: 'windows-latest'       # Windows (.msi / .exe)
            args: ''
          - platform: 'macos-14'             # macOS Apple Silicon (aarch64)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-13'             # macOS Intel (x86_64)
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: >-
            ${{ github.ref_type == 'tag' && github.ref_name
                || format('devops-station-ci-{0}', github.run_id) }}
          releaseName: >-
            ${{ github.ref_type == 'tag' && github.ref_name
                || format('CI build {0}', github.run_id) }}
          releaseBody: |
            DevOps Station 跨平台三端自动构建产物。

            ### 下载
            - **Windows**：`.msi`（推荐）或绿色版 `.exe`
            - **macOS**：`.dmg`（Apple Silicon / Intel 两个架构）
            - **Linux**：`.deb` / `.AppImage` / `.rpm`

            > 当前未配置代码签名：Windows 安装时会有 SmartScreen 提示；macOS 需右键「打开」或在终端执行
            > `xattr -cr "/Applications/DevOps Station.app"` 后启动。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
