name: Release

# 编译 Linux / macOS / Windows 三端安装包，并发布到 GitHub Releases。
# 用法：
#   - 推送 tag（如 v1.2.3）自动触发：npm version patch && git push github --follow-tags
#   - 或在 Actions 页面手动 Run workflow 做 CI 验证（会发布到草稿 Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'        # Linux (.deb / .AppImage / .rpm)
          - platform: 'windows-latest'       # Windows (.msi / .exe)
          - platform: 'macos-14'             # macOS Apple Silicon (aarch64)
            args: '--target aarch64-apple-darwin'

    # 注：macos-13 (Intel x86_64) 已从矩阵移除 —— GitHub 正在退役该机型，
    # 其 runner 长期处于 “Waiting for a runner” 排队、永远拿不到机器。
    # 如需 Intel Mac 支持，把上面的 args 改为 `--target universal-apple-darwin`
    # （在 macos-14 上编译出同时含两种架构的通用二进制）即可。

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            file \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.1-0 \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (ed25519). The public half lives in
          # src-tauri/tauri.conf.json (plugins.updater.pubkey); the private half
          # must be added as a repo secret (Settings → Secrets → Actions):
          #   TAURI_SIGNING_PRIVATE_KEY  = contents of .tauri/devops-station.key
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = (only if the key is passworded)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: >-
            ${{ github.ref_type == 'tag' && github.ref_name
                || format('devops-station-ci-{0}', github.run_id) }}
          releaseName: >-
            ${{ github.ref_type == 'tag' && github.ref_name
                || format('CI build {0}', github.run_id) }}
          releaseBody: |
            DevOps Station 跨平台三端自动构建产物。

            ### 下载
            - **Windows**：`.msi`（推荐）或绿色版 `.exe`
            - **macOS**：`.dmg`（Apple Silicon）
            - **Linux**：`.deb` / `.AppImage` / `.rpm`

            > 当前未配置代码签名：Windows 安装时会有 SmartScreen 提示；macOS 需右键「打开」或在终端执行
            > `xattr -cr "/Applications/DevOps Station.app"` 后启动。
          # Generate + upload the updater artifacts: `latest.json` (aggregated
          # across the matrix), per-platform `.sig` signatures and update packages.
          # Requires `bundle.createUpdaterArtifacts: true` in tauri.conf.json.
          includeUpdater: true
          # Published (not draft) so `releases/latest/download/latest.json` resolves
          # and in-app auto-update works. Change to `true` if you prefer to review
          # each release before publishing.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
