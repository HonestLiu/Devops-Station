[package]
name = "devops-station"
version = "0.1.15"
description = "Modern cross-platform DevOps workspace: SSH + SFTP + Serial + Monitoring"
authors = ["Hones"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "devops_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# OS-level (system-wide) quick-approve shortcut: fires even when the app window
# has no focus, so the user can approve a Claude Code / Codex prompt while
# looking at it in any terminal.
tauri-plugin-global-shortcut = "2"
# Direct dep so we can pin our own AppUserModelID on OS notifications (the
# notification plugin only sets it in release builds, which is why dev-mode
# toasts otherwise show up under "Windows PowerShell").
notify-rust = "4.18"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "process"] }
futures = "0.3"
async-trait = "0.1"

# `ring` backend avoids the aws-lc-sys build dependency (CMake + NASM) on Windows.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.4"

portable-pty = "0.9"
serialport = "4.9"
# Cross-platform BLE central (WinRT / CoreBluetooth / BlueZ). Backs the
# Bluetooth transparent-transmission transport that sits next to wired serial.
btleplug = "0.12"
sysinfo = "0.39"
rusqlite = { version = "0.40", features = ["bundled"] }

anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls", "stream"] }
base64 = "0.22"
chrono = "0.4"
# S3 SigV4 signing (object-storage sync). hmac + sha2 are tiny; we sign the
# requests ourselves on top of the existing reqwest, avoiding a second full
# HTTP stack (rust-s3 pulls reqwest 0.12, we're on 0.13).
hmac = "0.12"
sha2 = "0.10"

# MQTT client (ported MQTTX-style functionality). Uses rumqttc's `use-rustls`
# backend (tokio-rustls + ring crypto — same `ring` provider the SSH stack uses,
# so no aws-lc/CMake build chain) which is the only backend that exposes a `Wss`
# transport for secure websocket brokers. `rustls` is pinned to 0.22 (the version
# tokio-rustls 0.25 pulls); `TlsConfiguration::default()` (system trust store) is
# used for normal TLS, and a custom accept-all verifier is installed only for the
# `insecure_skip_verify` (self-signed broker) toggle. `websocket` enables ws:// and
# wss:// brokers. NOTE: rumqttc stores the `MqttOptions::new` *host* arg verbatim as
# `broker_addr`; the WS transports parse that as a full `scheme://host:port/path`
# URL, so for ws/wss we must pass the full URL there (a bare host yields
# `InvalidUrl(Host)` and an endless reconnect loop).
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls", "websocket"] }
rustls = { version = "=0.22", default-features = false, features = ["ring", "tls12", "logging"] }
http = "1"
font-kit = "0.13"
encoding_rs = "0.8"
chacha20poly1305 = "0.10"
getrandom = "0.2"
# Cross-platform "open with default app" helper. Replaces the fragile
# `cmd /c start` / `xdg-open` / `open` invocations in local_fs::open_url.
opener = "0.7"

# Used by crate::notify to register our Start Menu shortcut + AUMID on Windows.
# Windows-only: windows 0.61 pulls in windows-future 0.2.1 UNCONDITIONALLY, and
# that crate fails to compile off-Windows (it references windows_core::imp::
# IMarshal/marshaler, which only exist under #[cfg(windows)]). Gating the dep
# here means macOS/Linux never compile it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Storage_EnhancedStorage",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
